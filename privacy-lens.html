18px}.store{padding:12px 0;border-bottom:1px solid var(--line)}.store:last-child{border:0}.alert-title{font-weight:700;font-size:16px}.sensor-list{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}.sensor{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line);min-height:68px}.sensor:last-child{border-bottom:0}.sensor .sensor-name{font-size:16px;font-weight:650}.sensor .sensor-meta{font-size:13px;color:var(--muted)}.sensor .arrow-right{margin-left:auto;color:var(--muted);font-size:20px}.receipt-ring{width:144px;height:144px;border:9px solid #e9e8e1;border-top-color:var(--green2);border-right-color:#cbd9ce;border-radius:50%;display:grid;place-content:center;text-align:center;margin:22px auto 10px}.receipt-ring strong{font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}.receipt-ring span{font-size:14px;font-weight:650}.notice{border-radius:16px;padding:15px 16px;background:var(--sage);color:var(--green);display:flex;align-items:center;gap:12px;font-weight:650}.check{font-size:20px;font-weight:700}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo{height:98px;border-radius:13px;border:1px solid var(--line);background:#ecebe5;display:flex;align-items:flex-end;justify-content:space-between;padding:9px;font-size:13px;color:#4e4f49;cursor:pointer}.photo:nth-child(3n+2){background:#f4ead0}.photo:nth-child(3n){background:#e6eee8}.photo.selected{outline:3px solid var(--green2);outline-offset:-3px}.photo-check{width:20px;height:20px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-size:12px}.radio-list{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:4px 16px}.radio{display:flex;align-items:flex-start;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}.radio:last-child{border-bottom:0}.radio-dot{width:20px;height:20px;border:1.5px solid #888981;border-radius:50%;margin-top:2px;display:grid;place-items:center;flex:none}.radio.selected .radio-dot{border:6px solid var(--green)}.radio strong{font-weight:650}.switch{width:48px;height:28px;border:0;border-radius:99px;background:#c9c8c0;padding:3px;flex:none;transition:background .15s}.switch:after{content:"";display:block;width:22px;height:22px;background:white;border-radius:50%;box-shadow:0 1px 2px #0002;transition:transform .15s}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(20px)}.toast{position:absolute;z-index:4;top:52px;left:14px;right:14px;border-radius:14px;padding:13px 14px;background:var(--ink);color:white;display:flex;gap:10px;align-items:center;box-shadow:0 8px 22px #0002}.toast button{margin-left:auto;border:0;background:transparent;color:white;font-weight:650;white-space:nowrap}.bottom-nav{height:64px;flex:none;border-top:1px solid var(--line);background:var(--canvas);display:flex;align-items:center;justify-content:space-around;padding-bottom:5px}.bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:12px;min-width:54px;min-height:44px}.bottom-nav button.active{color:var(--green);font-weight:700}.home-indicator{position:absolute;z-index:5;bottom:7px;left:50%;transform:translateX(-50%);width:104px;height:4px;border-radius:9px;background:var(--ink)}.modal-shade{position:absolute;z-index:6;inset:0;background:#17181455;display:flex;align-items:flex-end}.modal{background:white;border-radius:26px 26px 0 0;width:100%;padding:23px 20px max(22px,env(safe-area-inset-bottom));box-shadow:0 -10px 38px #0002}.modal h2{font-size:22px;margin:0 0 8px}.modal p{margin:0 0 17px;color:var(--muted)}.modal .btn{margin-top:8px}.mobile-picker{display:none}

<body>
<main class="shell">
<aside class="rail"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span><span>Privacy Lens</span></div><div class="intro"><h1>Beyond Allow</h1><p>A calmer, clearer way to understand app access.</p></div><div id="screenNav"></div><p class="rail-foot">40 connected screens · Tap through the flow</p></aside>
<section class="stage"><div class="stage-head"><div class="stage-label" id="stageLabel">01 / 40 · Location request</div><div class="stage-controls"><button class="quiet" id="prevBtn" aria-label="Previous screen">← Back</button><button class="quiet" id="nextBtn" aria-label="Next screen">Next →</button></div></div><div class="mobile-picker"><select id="screenSelect" aria-label="Choose screen"></select></div><div class="device" id="device" aria-label="Phone prototype"><div class="status"><span>9:41</span><div class="status-right"><span class="signal">••• ◔</span><span class="battery"></span></div></div><header class="appbar" id="appbar"></header><div class="screen-scroll" id="screenScroll"></div><div class="bottom-nav" id="bottomNav"></div><div class="home-indicator"></div><div id="overlay"></div></div></section>
</main>
<script>
const screens=[
['01','Find nearby stores','Location · App context'],['02','Location permission','Location · Smart prompt'],['03','Why this access','Location · Details expanded'],['04','Location not allowed','Location · Denied'],['05','Allow once','Location · Temporary access'],['06','Location in use','Location · Active state'],['07','Permission receipt','Location · Consent record'],['08','Change permission','Location · Settings detail'],['09','Access updated','Location · Confirmation'],['10','Privacy Lens','Control centre · Overview'],
['11','Location access','Control centre · Sensor list'],['12','App location settings','Control centre · App detail'],['13','Needs review','Control centre · Alert'],['14','Ask next time','Control centre · Quick action'],['15','Review complete','Control centre · Confirmation'],['16','Photos permission','Photos · Request'],['17','Select photos','Photos · System picker'],['18','Photo selection','Photos · Manage access'],['19','Photos updated','Photos · Confirmation'],['20','Camera permission','Camera · Request'],
['21','Camera access active','Camera · Confirmation'],['22','Camera settings','Camera · Detail'],['23','Microphone permission','Microphone · Request'],['24','Microphone access active','Microphone · Confirmation'],['25','Microphone settings','Microphone · Detail'],['26','Contacts permission','Contacts · Request'],['27','Contacts access active','Contacts · Confirmation'],['28','Bluetooth permission','Bluetooth · Request'],['29','Bluetooth access active','Bluetooth · Confirmation'],['30','Sensor overview','Control centre · Sensors'],
['31','Recent receipts','Control centre · History'],['32','Receipt details','Control centre · Record'],['33','Remove access','Location · Confirmation step'],['34','Permission expired','Location · Expiry state'],['35','Review unused access','Control centre · Review'],['36','Permissions up to date','Control centre · Clear state'],['37','Data flow & purpose','Location · Transparency'],['38','Manage selected photos','Photos · Selection detail'],['39','Access removed','Location · Revoked'],['40','Privacy activity','Control centre · Timeline']
].map(([id,title,group])=>({id,title,group}));
let current=0, precise=false, duration='7 days', expanded=false, photos=new Set(['IMG 204','IMG 198']), permission='While Using the App', flash=false;
const iconPaths={location:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/>',phone:'<rect x="6" y="2.5" width="12" height="19" rx="2.3"/><path d="M10 18.5h4"/>',camera:'<path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.4"/>',mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/>',photos:'<rect x="4" y="4" width="15" height="15" rx="2"/><path d="M7 16l3.2-3.4 2.2 2.1 1.7-1.7L19 17M8 8h.01"/><path d="M7 20h13a2 2 0 0 0 2-2V7"/>',contacts:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.8"/>',bluetooth:'<path d="M12 2v20l7-6-14-8M5 16l14-8-7-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',shield:'<path d="M12 2 20 5v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>'};
function icon(type,size=24){return `<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="${size}" height="${size}">${iconPaths[type]||iconPaths.shield}</svg></span>`}
function btn(text,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${text}</button>`}
function inline(text,action){return `<button class="inline-btn" data-action="${action}">${text}</button>`}
function metric(label,value){return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div></div>`}
function flow(){return `<div class="flow" aria-label="Your device to Blinkit, no ad partners"><span>YOUR DEVICE</span><span class="arrow">→</span><span>BLINKIT</span><span class="arrow">→</span><span class="blocked">NO AD PARTNERS</span></div>`}
function rights(){return `<div class="rights"><button data-action="expand"><span>Why &amp; DPDP Rights</span><span class="chevron ${expanded?'open':''}">⌄</span></button>${expanded?`<div class="detail-row"><div class="label">PURPOSE</div><div class="value">Nearby stores and delivery estimates.</div></div><div class="detail-row"><div class="label">RETENTION</div><div class="value">Location is discarded when this session ends.</div></div><div class="detail-row"><div class="label">YOUR CONTROL</div><div class="value">Change or remove access in Privacy Lens at any time.</div></div>`:''}</div>`}
function durationControl(){return `<div class="section"><div class="row between"><span class="small">Auto-expire access</span><span class="chip">${duration}</span></div><div class="segmented" role="group" aria-label="Auto-expire access"><button data-duration="End of session" class="${duration==='End of session'?'selected':''}">End of session</button><button data-duration="24 hours" class="${duration==='24 hours'?'selected':''}">24 hours</button><button data-duration="7 days" class="${duration==='7 days'?'selected':''}">7 days</button></div></div>`}
function appbar(right=''){return `<span>Privacy Lens</span>${right?`<button class="right-action" data-action="${right==='Done'?'dashboard':'receipts'}">${right}</button>`:''}`}
function base(title,subtitle,content,eyebrow=''){return `<div class="screen-body">${eyebrow?`<p class="eyebrow">${eyebrow}</p>`:''}<h1 class="title">${title}</h1>${subtitle?`<p class="subtitle">${subtitle}</p>`:''}${content}</div>`}
function summary(rows){return `<div class="card">${rows.map(([a,b])=>`<div class="detail-row"><div class="label">${a}</div><div class="value">${b}</div></div>`).join('')}</div>`}
function trigger(){return base('Find stores near you','Set your delivery location to see nearby dark stores.',`<div class="card" style="margin-top:18px"><div class="icon-pad">${icon('location')}</div><h2 style="font-size:24px;line-height:1.2;margin:16px 0 5px;font-weight:600">Set a delivery location</h2><p class="small">Use a nearby area to find stores that deliver to you.</p><div class="pill">APPROXIMATE · RECOMMENDED</div><p class="small" style="margin:12px 0 0">You can enter an address instead.</p></div><div class="section"><h2>Privacy, in plain language</h2><p class="small">You choose how much location detail Blinkit can use and for how long.</p></div>`,`Blinkit · DELIVERY`)}
function prompt(){return `<div class="screen-body"><div class="row start" style="gap:12px;margin-bottom:8px"><div class="icon-pad">${icon('location')}</div><h1 class="title" style="font-size:24px;margin:0">Allow Blinkit to access this device’s location?</h1></div><p class="subtitle" style="margin:8px 0 16px">Approximate location is enough to find nearby stores.</p><div class="pill" style="margin-bottom:10px">RECOMMENDED · SAFEST CHOICE</div><div class="toggle" role="group" aria-label="Location accuracy"><button class="${precise?'selected':''}" data-action="precise">Precise</button><button class="${!precise?'selected sage-sel':''}" data-action="approx">Approximate${!precise?' ✓':''}</button></div><div class="grid3" style="margin-top:10px">${metric('Scope',precise?'Precise':'Approx. 2 km')}${metric('Storage','On-device')}${metric('Sharing','0 partners')}</div><div class="section" style="margin:15px 0">${flow()}</div>${rights()}${durationControl()}</div><div class="action-stack">${btn('Allow While Using App','allow','primary')}${btn('Allow Once','once')}${btn('Don’t Allow','deny','text')}</div>`}
function dashboard(alert=true){return base('Privacy Lens','12 active permissions across 9 apps.',`${alert?`<div class="card alert" style="margin-bottom:18px"><div class="row start">${icon('clock')}<div><div class="alert-title">Needs review · Instagram</div><div class="small" style="color:#6f514c">Location is set to While Using and hasn’t been used in 45 days.</div></div></div><div class="stack" style="margin-top:14px">${btn('Switch to Ask Next Time','asknext')}${btn('Review Instagram access','instagram')}</div></div>`:''}<div class="section" style="margin-top:8px"><h2>Permissions</h2><div class="sensor-list">${[['location','Location','7 apps active · 1 needs review','location'],['camera','Camera','3 apps · While Using','camera'],['mic','Microphone','2 apps · While Using','microphone'],['photos','Photos','8 apps · 5 limited','photos'],['contacts','Contacts','2 apps · Ask before access','contacts'],['bluetooth','Bluetooth','1 app · While Using','bluetooth']].map(([ic,n,m,d])=>`<button class="sensor" data-action="${d}" style="width:100%;border-top:0;border-left:0;border-right:0;background:white;text-align:left">${icon(ic)}<span><span class="sensor-name">${n}</span><br><span class="sensor-meta">${m}</span></span><span class="arrow-right">›</span></button>`).join('')}</div></div><div class="section"><div class="row between"><h2 style="margin:0">Recent receipts</h2>${inline('See all','receipts')}</div><div class="card" style="margin-top:12px"><div class="row between"><div><strong>Blinkit · Location</strong><div class="small">Approximate · ${duration} left</div></div>${icon('arrow')}</div></div></div>`,'CONTROL CENTRE')}
function permissionDetail(sensor='Location'){let ic=sensor==='Camera'?'camera':sensor==='Microphone'?'mic':sensor==='Photos'?'photos':sensor==='Contacts'?'contacts':sensor==='Bluetooth'?'bluetooth':'location';return base(`${sensor} access`,`Choose what Blinkit can access and when.`,`<div class="radio-list">${[['Never','No access'],['Ask Next Time or When I Share','Ask before each request'],['While Using the App','Currently selected']].map(([a,b])=>`<button class="radio ${permission===a?'selected':''}" data-permission="${a}" style="width:100%;text-align:left;background:transparent;border:0"><span class="radio-dot"></span><span><strong>${a}</strong><br><span class="small">${b}</span></span></button>`).join('')}</div><div class="card" style="margin-top:16px"><div class="row between"><div><div class="label">PRECISE LOCATION</div><div class="value">${precise?'On · exact location':'Off · approximate location'}</div></div><button class="switch ${precise?'on':''}" aria-label="Toggle Precise Location" aria-pressed="${precise}" data-action="precise"></button></div><div class="divider"></div><div class="row between"><div><div class="label">AUTO-EXPIRE</div><div class="value">Reset after ${duration} of inactivity</div></div><button class="switch on" aria-label="Toggle auto-expire" aria-pressed="true" data-action="timer"></button></div></div><div class="section">${inline('View permission receipt','receipt')}</div>`,`${sensor.toUpperCase()} · BLINKIT`)}
function receipt(){return base('Permission receipt','ID #PL-204 · 15 Oct 2026 · 00:40',`<div class="receipt-ring"><strong>7</strong><span>DAYS LEFT</span></div><p style="text-align:center;margin:4px 0 20px">Ask Next Time on 22 Oct</p><div class="card"><div class="label" style="margin-bottom:8px">PERMISSION SUMMARY</div><div class="detail-row"><div class="label">APP</div><div class="value"><strong>Blinkit</strong></div></div><div class="detail-row"><div class="label">ACCESS GRANTED</div><div class="value">${precise?'Precise':'Approximate'} · ${permission==='While Using the App'?'While using':'Once'}</div></div><div class="detail-row"><div class="label">DATA STORAGE</div><div class="value" style="color:var(--green)">On-device only</div></div><div class="detail-row"><div class="label">THIRD-PARTY SHARING</div><div class="value" style="color:var(--green)">0 partners · blocked</div></div></div><p class="small" style="margin:18px 4px 0">Expiry stops future access, not data already collected.</p>`,`15 OCT 2026 · 00:40`)}
function photoPicker(){let names=['IMG 204','IMG 198','IMG 176','IMG 165','IMG 152','IMG 141'];return base('Choose photos','Only the photos you select will be available to Blinkit.',`<div class="photo-grid">${names.map(n=>`<button class="photo ${photos.has(n)?'selected':''}" data-photo="${n}" aria-pressed="${photos.has(n)}"><span>${n}</span>${photos.has(n)?'<span class="photo-check">✓</span>':''}</button>`).join('')}</div><div class="card" style="margin-top:18px"><div class="detail-row"><div class="label">SELECTED</div><div class="value">${photos.size} ${photos.size===1?'photo':'photos'} shared</div></div><div class="detail-row"><div class="label">AVAILABLE</div><div class="value">Other photos stay private</div></div><div class="detail-row"><div class="label">CONTROL</div><div class="value">Changes apply immediately</div></div></div>`,`SYSTEM PHOTO PICKER`)}
function flowContent(i){switch(i){
case 0:return {bar:'Blinkit',body:trigger(),actions:[btn('Use Current Location','prompt','primary'),btn('Enter Address Manually','dashboard')]};
case 1:case 2:return {bar:appbar(),body:prompt(),actions:[]};
case 3:return {bar:appbar('Done'),body:base('Location not allowed','Blinkit can’t show nearby stores without a delivery location.',`<div class="card"><div class="row">${icon('location')}<strong>Location access is off</strong></div><p class="small" style="margin:10px 0 0">You can enter an address or change access in Privacy Lens.</p></div>`,'REQUEST DECLINED'),actions:[btn('Enter address instead','dashboard','primary'),btn('Review location access','detail')]};
case 4:return {bar:appbar(),body:base('One-time access','Blinkit can use your approximate location for this request only.',`<div class="notice">${icon('check')}Access allowed once</div><div class="section">${flow()}</div>`,`ALLOW ONCE`),actions:[btn('Find nearby stores','active','primary'),btn('View receipt','receipt')]};
case 5:return {bar:appbar(),body:base('Nearby stores are ready','Approximate location is active while Blinkit is open.',`<div class="app-preview"><div class="store"><strong>Fresh Basket</strong><br><span class="small">1.2 km · 18-25 min</span></div><div class="store"><strong>Daily Needs</strong><br><span class="small">2.0 km · 25-35 min</span></div></div><div class="notice">${icon('check')}Location · Approximate · Expires in 7 days <button class="inline-btn" data-action="receipt">View receipt</button></div>`,'LOCATION ACTIVE'),actions:[btn('Manage access','detail','primary'),btn('Privacy Lens','dashboard')]};
case 6:return {bar:appbar('Done'),body:receipt(),actions:[btn('Done','active','primary'),btn('Change Permission','detail'),btn('Remove Access Now','remove','destructive')]};
case 7:return {bar:appbar('Done'),body:permissionDetail('Location'),actions:[btn('Save Permission','updated','primary'),btn('Remove Permission & Delete History','remove','destructive')]};
case 8:return {bar:appbar(),body:base('Permission updated','Blinkit’s location access has been changed.',`<div class="notice">${icon('check')}Location is now set to ${permission}</div>${summary([['CURRENT SETTING',permission],['RECEIPT','Saved as #PL-204'],['CONTROL','Change this in Privacy Lens.']])}`,'UPDATED'),actions:[btn('Done','dashboard','primary'),btn('View receipt','receipt')]};
case 9:return {bar:appbar(),body:dashboard(true),actions:[]};
case 10:return {bar:appbar('Done'),body:dashboard(false),actions:[]};
case 11:return {bar:appbar(),body:permissionDetail('Location'),actions:[btn('Save Permission','updated','primary'),btn('Remove Permission','remove','destructive')]};
case 12:return {bar:appbar(),body:base('Instagram · Location','This permission has not been used in 45 days.',summary([['CURRENT ACCESS','While Using'],['LAST USED','45 days ago'],['RECOMMENDATION','Ask Next Time']]),'NEEDS REVIEW'),actions:[btn('Switch to Ask Next Time','asknext','primary'),btn('Keep While Using','dashboard')]};
case 13:return {bar:appbar(),body:base('Instagram will ask next time','Location access has been reduced.',`<div class="notice">${icon('check')}Instagram · Ask Next Time</div><div class="section">${summary([['PREVIOUS','While Using'],['UPDATED','Ask Next Time'],['HISTORY','Existing records remain in your receipt history']])}</div>`,'UPDATED PERMISSION'),actions:[btn('Done','dashboard','primary'),btn('Undo change','instagram')]};
case 14:return {bar:appbar(),body:base('Review complete','Your permissions are up to date.',`<div class="notice">${icon('check')}No permissions need review</div><div class="section">${summary([['INSTAGRAM','Ask Next Time'],['BLINKIT','Approximate · While Using'],['NEXT REVIEW','When access is unused for 45 days']])}</div>`,'PRIVACY CHECK'),actions:[btn('Back to Privacy Lens','dashboard','primary')]};
case 15:return {bar:appbar(),body:base('Allow Blinkit to access selected photos?','Choose only the photos needed for your order.',`${metric('Scope','Selected photos')}${rights()}`,'PHOTOS · PERMISSION'),actions:[btn('Select Photos','picker','primary'),btn('Allow All Photos','photogrant'),btn('Don’t Allow','deny','text')]};
case 16:case 17:return {bar:appbar('Done'),body:photoPicker(),actions:[btn(`Allow access to ${photos.size} selected photos`,'photogranted','primary'),btn('Cancel','dashboard')]};
case 18:return {bar:appbar(),body:base('Selected photos access granted','Blinkit can see only the photos you selected.',`<div class="notice">${icon('check')}Blinkit can see ${photos.size} selected ${photos.size===1?'photo':'photos'}</div><div class="section">${summary([['ACCESS','Selected photos only'],['OTHER PHOTOS','Unavailable to the app'],['CHANGE','Manage this permission any time']])}</div>`,'PHOTOS UPDATED'),actions:[btn('Done','dashboard','primary'),btn('Manage selected photos','picker')]};
case 19:return {bar:appbar(),body:base('Allow Blinkit to use your camera?','Camera access is used only when you take a photo in the app.',`${flow()}${rights()}`,'CAMERA · PERMISSION'),actions:[btn('Allow While Using App','cameraactive','primary'),btn('Allow Once','cameraactive'),btn('Don’t Allow','deny','text')]};
case 20:return {bar:appbar(),body:base('Camera access is active','Blinkit can use the camera while you use the app.',`<div class="notice">${icon('check')}Camera · While Using</div>`,'UPDATED'),actions:[btn('Manage Camera Access','cameradetail','primary'),btn('Privacy Lens','dashboard')]};
case 21:return {bar:appbar(),body:permissionDetail('Camera'),actions:[btn('Save Permission','cameraactive','primary'),btn('Remove Permission','remove','destructive')]};
case 22:return {bar:appbar(),body:base('Allow Blinkit to use your microphone?','Microphone access is used when you record a voice note.',`${flow()}${rights()}`,'MICROPHONE · PERMISSION'),actions:[btn('Allow While Using App','micactive','primary'),btn('Allow Once','micactive'),btn('Don’t Allow','deny','text')]};
case 23:return {bar:appbar(),body:base('Microphone access is active','Blinkit can use the microphone while you use the app.',`<div class="notice">${icon('check')}Microphone · While Using</div>`,'UPDATED'),actions:[btn('Manage Microphone Access','micdetail','primary'),btn('Privacy Lens','dashboard')]};
case 24:return {bar:appbar(),body:permissionDetail('Microphone'),actions:[btn('Save Permission','micactive','primary'),btn('Remove Permission','remove','destructive')]};
case 25:return {bar:appbar(),body:base('Allow Blinkit to access your contacts?','Contacts can help share a shopping list.',`<div class="grid3">${metric('Scope','Contacts')}${metric('Storage','On-device')}${metric('Sharing','0 partners')}</div><div class="section">${flow()}</div>${rights()}`,'CONTACTS · PERMISSION'),actions:[btn('Allow While Using App','contactsactive','primary'),btn('Allow Once','contactsactive'),btn('Don’t Allow','deny','text')]};
case 26:return {bar:appbar(),body:base('Contacts access is active','Blinkit can use contacts while you use the app.',`<div class="notice">${icon('check')}Contacts · While Using</div>`,'UPDATED'),actions:[btn('Manage Contacts Access','contactdetail','primary'),btn('Privacy Lens','dashboard')]};
case 27:return {bar:appbar(),body:base('Allow Blinkit to connect to nearby devices?','Bluetooth access helps find nearby delivery accessories.',`${metric('Scope','Nearby devices')}${rights()}`,'BLUETOOTH · PERMISSION'),actions:[btn('Allow While Using App','btactive','primary'),btn('Allow Once','btactive'),btn('Don’t Allow','deny','text')]};
case 28:return {bar:appbar(),body:base('Bluetooth access is active','Blinkit can discover nearby devices while you use the app.',`<div class="notice">${icon('check')}Bluetooth · While Using</div>`,'UPDATED'),actions:[btn('Manage Bluetooth Access','btdetail','primary'),btn('Privacy Lens','dashboard')]};
case 29:return {bar:appbar(),body:dashboard(false),actions:[]};
case 30:return {bar:appbar(),body:base('Recent receipts','A clear history of permissions you approved or changed.',`<div class="sensor-list">${[['Location','Approximate · 7 days left','receipt'],['Photos',`${photos.size} selected · Updated today`,'photosuccess'],['Camera','While Using · 2 days left','cameraactive'],['Instagram Location','Ask Next Time · Updated today','instagram']].map(([n,m,a])=>`<button class="sensor" data-action="${a}" style="width:100%;background:white;text-align:left;border:0;border-bottom:1px solid var(--line)">${icon('clock')}<span><span class="sensor-name">${n}</span><br><span class="sensor-meta">${m}</span></span><span class="arrow-right">›</span></button>`).join('')}</div>`,'PERMISSION HISTORY'),actions:[btn('Privacy Lens','dashboard','primary')]};
case 31:return {bar:appbar(),body:receipt(),actions:[btn('Done','dashboard','primary'),btn('Change Permission','detail'),btn('Remove Access Now','remove','destructive')]};
case 32:return {bar:appbar(),body:base('Remove Blinkit location access?','Blinkit will need to ask again to use your location.',`<div class="card alert"><strong>What changes</strong><p class="small" style="color:#6f514c;margin:8px 0 0">Future location access stops. Your receipt remains available in Privacy Lens history.</p></div>`,'REMOVE ACCESS'),actions:[btn('Remove Access Now','removed','destructive'),btn('Keep Access','receipt')]};
case 33:return {bar:appbar(),body:base('Location permission expired','Blinkit needs to ask again before using your location.',`<div class="notice">${icon('clock')}Access ended · Ask Next Time</div><div class="section">${summary([['APP','Blinkit'],['ACCESS','Approximate location'],['NEXT STEP','Choose again when Blinkit asks']])}</div>`,'AUTO-EXPIRED'),actions:[btn('Done','dashboard','primary'),btn('Review receipt','receipt')]};
case 34:return {bar:appbar(),body:dashboard(true),actions:[]};
case 35:return {bar:appbar(),body:dashboard(false),actions:[btn('View recent activity','timeline','primary')]};
case 36:return {bar:appbar(),body:base('Where your location goes','See the route and who can receive your information.',`<div class="card">${flow()}<p style="margin:18px 0 0">Location supports nearby stores and delivery estimates. It is not shared with advertising partners.</p></div><div class="section"><h2>Purpose &amp; data details</h2>${summary([['PURPOSE','Find nearby stores and estimate delivery time'],['STORAGE','Kept on-device for this prototype'],['SHARING','No advertising partners']])}</div>${rights()}`,'LOCATION · TRANSPARENCY'),actions:[btn('Back to permission','prompt','primary')]};
case 37:return {bar:appbar(),body:base('Manage selected photos','Update which photos Blinkit can view.',`<h2 style="font-size:17px;margin:12px 0">Selected photos</h2><div class="photo-grid">${['IMG 204','IMG 198','IMG 176','IMG 165','IMG 152','IMG 141'].map(n=>`<button class="photo ${photos.has(n)?'selected':''}" data-photo="${n}" aria-pressed="${photos.has(n)}"><span>${n}</span>${photos.has(n)?'<span class="photo-check">✓</span>':''}</button>`).join('')}</div><div class="card" style="margin-top:16px">${summary([['SELECTED',`${photos.size} photos currently shared`],['AVAILABLE','Other photos stay private'],['CONTROL','Changes apply immediately']])}</div>`,'PHOTOS · LIMITED ACCESS'),actions:[btn('Save Photo Selection','photogranted','primary'),btn('Remove Photo Access','remove','destructive')]};
case 38:return {bar:appbar(),body:base('Location access removed','Blinkit will ask next time it needs your location.',`<div class="notice">${icon('check')}Location access removed</div><div class="section">${summary([['CURRENT SETTING','Ask Next Time'],['RECEIPT','Saved as #PL-204'],['CONTROL','Change this in Privacy Lens']])}</div>`,'BLINKIT LOCATION ACCESS REMOVED'),actions:[btn('Done','dashboard','primary'),btn('View Receipt','receipt')]};
case 39:return {bar:appbar(),body:base('Privacy activity','Recent permission changes, approvals and expiry events.',`<div class="sensor-list">${[['Today · 00:40','Blinkit location · Approximate access granted'],['Today · 00:38','Receipt #PL-204 created'],['Yesterday','Instagram location switched to Ask Next Time'],['15 Oct','Blinkit access scheduled to expire']].map(([a,b])=>`<div class="sensor">${icon('clock')}<span><span class="sensor-name">${a}</span><br><span class="sensor-meta">${b}</span></span></div>`).join('')}</div>`,'ACTIVITY'),actions:[btn('Back to Privacy Lens','dashboard','primary')]};
}}
function render(){let s=flowContent(current);document.getElementById('appbar').innerHTML=s.bar;document.getElementById('screenScroll').innerHTML=s.body;document.getElementById('overlay').innerHTML='';let a=document.querySelector('.action-stack');if(a)a.remove();if(s.actions&&s.actions.length){let stack=document.createElement('div');stack.className='action-stack';stack.innerHTML=s.actions.join('');document.getElementById('device').insertBefore(stack,document.getElementById('bottomNav'))}document.getElementById('bottomNav').innerHTML=`<button data-action="trigger" class="${current===0?'active':''}">Home</button><button data-action="dashboard" class="${[9,10,29,34,35].includes(current)?'active':''}">Privacy</button><button data-action="timeline" class="${current===39?'active':''}">Activity</button><button data-action="dashboard">Settings</button>`;document.getElementById('stageLabel').textContent=`${screens[current].id} / 40 · ${screens[current].group}`;document.getElementById('screenSelect').value=String(current);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===current));document.getElementById('screenScroll').scrollTop=0;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===39}
function go(i){current=Math.max(0,Math.min(39,i));render()}
const nav=document.getElementById('screenNav');let last='';screens.forEach((s,i)=>{if(s.group!==last){let h=document.createElement('div');h.className='group-title';h.textContent=s.group.split(' · ')[0];nav.append(h);last=s.group}let b=document.createElement('button');b.dataset.index=i;b.innerHTML=`<span class="num">${s.id}</span>${s.title}`;b.onclick=()=>go(i);nav.append(b);let opt=document.createElement('option');opt.value=i;opt.textContent=`${s.id} · ${s.title}`;document.getElementById('screenSelect').append(opt)});
document.getElementById('prevBtn').onclick=()=>go(current-1);document.getElementById('nextBtn').onclick=()=>go(current+1);document.getElementById('screenSelect').onchange=e=>go(Number(e.target.value));
document.addEventListener('click',e=>{let t=e.target.closest('[data-action],[data-duration],[data-permission],[data-photo]');if(!t)return;if(t.dataset.duration){duration=t.dataset.duration;render();return}if(t.dataset.permission){permission=t.dataset.permission;render();return}if(t.dataset.photo){const p=t.dataset.photo;photos.has(p)?photos.delete(p):photos.add(p);render();return}let a=t.dataset.action;const routes={trigger:0,prompt:1,expand:'expand',precise:'precise',approx:'approx',allow:5,once:4,deny:3,active:5,receipt:6,detail:7,updated:8,dashboard:9,location:10,camera:21,microphone:24,photos:37,contacts:26,bluetooth:28,instagram:12,asknext:13,review:14,picker:16,photogrant:18,photogranted:18,photosuccess:18,cameraactive:20,cameradetail:21,micactive:23,micdetail:24,contactsactive:26,contactdetail:26,btactive:28,btdetail:28,receipts:30,remove:32,removed:38,removedone:38,timeline:39,timer:'timer'};if(a==='expand'){expanded=!expanded;render();return}if(a==='precise'){precise=!precise;render();return}if(a==='approx'){precise=false;render();return}if(a==='timer'){duration=duration==='End of session'?'7 days':'End of session';render();return}if(a==='photogrant'){photos=new Set(['IMG 204','IMG 198','IMG 176','IMG 165','IMG 152','IMG 141']);go(18);return}if(a==='photogranted'){go(18);return}if(a==='removed'){permission='Ask Next Time';go(38);return}if(a==='asknext'){permission='Ask Next Time or When I Share';go(13);return}if(a==='updated'){go(8);return}if(a==='allow'){permission='While Using the App';go(5);return}if(a==='once'){permission='Allow Once';go(4);return}if(a==='deny'){permission='Never';go(3);return}if(a==='save'){go(8);return}if(typeof routes[a]==='number')go(routes[a]);});
render();
</script>
